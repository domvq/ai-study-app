<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg: #f8fafc;
  --sf: #ffffff;
  --ink: #0f172a;
  --mut: #64748b;
  --ln: #e2e8f0;
  --ac: #4255ff; /* Quizlet blue */
  --ac-hover: #3140d6;
  --hl: #ffcd1f; /* Quizlet yellow */
  --ok: #23b26d;
  --bad: #ff7070;
  --r: 16px;
  --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
  --shadow-lg: 0 10px 30px -4px rgba(15, 23, 42, 0.08);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg: #0a0f1d;
    --sf: #131b2e;
    --ink: #f1f5f9;
    --mut: #94a3b8;
    --ln: #1e293b;
    --ac: #5863f8;
    --ac-hover: #4550e6;
    --hl: #ffcd1f;
    --ok: #23b26d;
    --bad: #ff7070;
  }
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Plus Jakarta Sans',system-ui,sans-serif}
h1,h2,h3{font-weight:700;letter-spacing:-0.02em;line-height:1.2}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--ln);background:var(--sf);position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:1.4rem;display:flex;align-items:center;gap:8px}
header h1 span{background:var(--ac);color:#fff;padding:2px 8px;border-radius:8px;font-size:0.95rem;font-weight:800}
main{max-width:960px;margin:0 auto;padding:24px 16px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:10px 18px;font-weight:600;transition:all .15s ease}
button:hover{border-color:var(--ac);transform:translateY(-1px)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 4px 12px rgba(66,85,255,0.25)}
button.pri:hover{background:var(--ac-hover)}
button:disabled{opacity:.55;cursor:wait;transform:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
textarea,input[type=text],input[type=password]{width:100%;border:2px solid var(--ln);background:var(--sf);border-radius:12px;padding:12px 16px;transition:border-color .15s}
textarea:focus,input[type=text]:focus{border-color:var(--ac);outline:none}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 24px;background:var(--sf);padding:6px;border:1px solid var(--ln);border-radius:16px;box-shadow:var(--shadow)}
.tabs button{border-radius:10px;border:none;background:transparent;color:var(--mut);padding:10px 16px;font-weight:600}
.tabs button:hover{background:var(--bg);color:var(--ink);transform:none}
.tabs button[aria-selected=true]{background:var(--ac);color:#fff;box-shadow:0 2px 8px rgba(66,85,255,0.3)}
.mut{color:var(--mut);font-size:.92rem}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:6px 14px;font-size:.88rem;font-weight:500}
.chip b{cursor:pointer;color:var(--mut)}
.chip b:hover{color:var(--bad)}
.err{color:var(--bad);margin:8px 0;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.fc{min-height:200px;text-align:center;padding:24px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;background:var(--sf);border:2px solid var(--ln);border-radius:var(--r);box-shadow:var(--shadow);cursor:pointer;font-size:1.1rem;font-weight:600}
.fc:hover{border-color:var(--ac);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.fc.flip{background:var(--ac);color:#fff;border-color:var(--ac)}
.fc small{opacity:.75;font-weight:normal;font-size:.85rem}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px 16px;border-radius:12px;border:2px solid var(--ln);background:var(--sf);font-weight:500}
.opt:hover{border-color:var(--ac);background:var(--bg)}
.opt.right{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 12%,var(--sf))!important;color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 12%,var(--sf))!important;color:var(--bad)}
.slide{min-height:340px;padding:32px;display:flex;flex-direction:column;justify-content:center}
.slide h2{margin-top:0;font-size:1.8rem}
.md h1,.md h2,.md h3{margin:1.2em 0 .4em}
.md li{margin:.3em 0}
.md a,.src a{color:var(--ac);text-decoration:none;font-weight:600}
.md a:hover{text-decoration:underline}
.src li{margin:6px 0;font-size:.92rem}
details{border:1px solid var(--ln);border-radius:12px;padding:14px 18px;margin:10px 0;background:var(--sf);box-shadow:var(--shadow)}
summary{cursor:pointer;font-weight:700}
.msg{padding:14px 18px;border-radius:12px;margin:10px 0;background:var(--bg);border:1px solid var(--ln)}
.msg.u{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(prefers-reduced-motion:no-preference){.fc,.button,.opt{transition:all .2s cubic-bezier(0.4,0,0.2,1)}}
</style>
</head>
<body>
<header>
  <h1><span>Study</span> AI</h1>
</header>
<main>
  <section class="card">
    <h2 style="margin-top:0">What do you want to study today?</h2>
    <textarea id="topic" rows="3" placeholder="Type a topic, a question, or paste notes. Example: Cardiac action potentials and arrhythmias"></textarea>
    <div class="row" style="margin-top:14px">
      <label class="mut" style="cursor:pointer;display:flex;align-items:center;gap:8px">
        📎 Upload documents (PDF, DOCX, TXT, MD, CSV)
        <input type="file" id="files" multiple accept=".pdf,.docx,.txt,.md,.csv,.json" style="display:none">
      </label>
    </div>
    <div id="docs" class="row" style="margin-top:10px"></div>
    <div class="row" style="margin-top:14px">
      <label class="mut" style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="useSearch" checked style="width:18px;height:18px;accent-color:var(--ac)"> Search credible sources on the web
      </label>
    </div>
  </section>

  <div class="tabs" role="tablist" id="tabs"></div>
  <section id="panel"></section>
  <section class="card src" id="srcBox" hidden><h3 style="margin-top:0">Sources used</h3><ul id="srcList"></ul></section>
  <p class="mut" style="text-align:center;font-size:0.85rem">AI-generated study material can contain errors. Check linked sources before relying on it.</p>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};
const API_URL = 'https://study-ai-proxy.domhasaball.workers.dev';
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const S = { docs: [], sources: [], flash: [], quiz: [], slides: [], expert: [], guide: '', spark: '', chat: [], tab: 'flash', idx: 0, busy: false, err: '' };

const TOOLS = [
  ['flash','Flashcards'],['quiz','Practice Test'],['slides','Slide Deck'],
  ['guide','Study Guide'],['expert','Expert Solutions'],['spark','Quick Notes'],['ask','AI Tutor']
];

/* ---------- documents ---------- */
$('#files').onchange = async ev => {
  for (const f of ev.target.files) {
    try {
      const ext = f.name.split('.').pop().toLowerCase();
      if (ext === 'pdf') {
        if (f.size > 25e6) throw new Error('PDF is over 25 MB');
        S.docs.push({ name: f.name, text: await readPdf(f) });
      } else if (ext === 'docx') {
        await loadMammoth();
        const out = await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
        S.docs.push({ name: f.name, text: out.value });
      } else {
        S.docs.push({ name: f.name, text: await f.text() });
      }
    } catch (e) { S.err = 'Could not read ' + f.name + ': ' + e.message; render(); }
  }
  ev.target.value = ''; drawDocs();
};
async function readPdf(f){
  if (!window.pdfjsLib) {
    await new Promise((res, rej) => { const t = document.createElement('script'); t.src = PDFJS + 'pdf.min.js'; t.onload = res; t.onerror = () => rej(new Error('PDF reader failed to load')); document.head.appendChild(t); });
    const w = await (await fetch(PDFJS + 'pdf.worker.min.js')).text();
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([w], { type: 'text/javascript' }));
  }
  const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
  let out = '';
  for (let i = 1; i <= Math.min(pdf.numPages, 80); i++) out += (await (await pdf.getPage(i)).getTextContent()).items.map(x => x.str).join(' ') + '\n';
  if (out.trim().length < 50) throw new Error('no readable text (scanned PDFs are not supported)');
  return out;
}
function loadMammoth(){
  if (window.mammoth) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'; s.onload = res; s.onerror = () => rej(new Error('DOCX reader failed to load')); document.head.appendChild(s); });
}
function drawDocs(){
  $('#docs').innerHTML = S.docs.map((d, i) => `<span class="chip">${esc(d.name)} <b data-i="${i}" role="button" aria-label="Remove ${esc(d.name)}">×</b></span>`).join('');
  document.querySelectorAll('#docs b').forEach(b => b.onclick = () => { S.docs.splice(+b.dataset.i, 1); drawDocs(); });
}

/* ---------- AI call ---------- */
const SYSTEM = `You are an expert tutor inside a study app. Use credible sources only: peer-reviewed research, textbooks, government and university sites, and established professional organizations. Never invent facts, statistics, quotes, or citations.`;
const DOC_CHARS = 24000;
async function call(prompt, { search = true, max = 4000, system = SYSTEM, history = [] } = {}) {
  if (API_URL.includes('YOUR-WORKER')) throw new Error('This app is not connected to its AI service yet.');
  const topic = $('#topic').value.trim();
  if (!topic && !S.docs.length) throw new Error('Type a topic or upload a document first.');
  let left = DOC_CHARS, lead = '';
  for (const d of S.docs) { const t = d.text.slice(0, Math.max(left, 0)); left -= t.length; if (t) lead += `Uploaded document "${d.name}":\n${t}\n\n`; }
  lead += `Study topic: ${topic || '(use the uploaded documents)'}`;
  const messages = [{ role: 'user', content: lead }, ...history.map(h => ({ role: h.role, content: h.text })), { role: 'user', content: prompt }];
  const merged = [];
  for (const m of messages) { const l = merged[merged.length - 1]; if (l && l.role === m.role) l.content += '\n\n' + m.content; else merged.push({ ...m }); }
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ search: search && $('#useSearch').checked, max_tokens: max, system, messages: merged })
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 429) throw new Error('The free AI service is busy right now. Wait a minute and try again.');
  if (!r.ok) throw new Error(data?.error?.message || 'Request failed (' + r.status + ')');
  const m = data.choices?.[0]?.message || {};
  collectSources(m.executed_tools);
  drawSources();
  return String(m.content || '').replace(/【[^】]*】/g, '').trim();
}
function collectSources(o, d = 0){
  if (!o || d > 6) return;
  if (Array.isArray(o)) return o.forEach(x => collectSources(x, d + 1));
  if (typeof o !== 'object') return;
  if (typeof o.url === 'string' && /^https?:/.test(o.url)) addSource(o.url, o.title);
  Object.values(o).forEach(v => collectSources(v, d + 1));
}
function addSource(url, title){ if (!S.sources.some(s => s.url === url)) S.sources.push({ url, title: title || url }); }
function drawSources(){
  $('#srcBox').hidden = !S.sources.length;
  $('#srcList').innerHTML = S.sources.map(s => { let h = ''; try { h = new URL(s.url).hostname; } catch {} return /^https?:/.test(s.url) ? `<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a> <span class="mut">${esc(h)}</span></li>` : ''; }).join('');
}
function parseJSON(t){
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < 0) throw new Error('The AI did not return usable content. Try again.');
  return JSON.parse(t.slice(a, b + 1));
}

/* ---------- generators ---------- */
const JSONRULE = 'Respond with one JSON object only, no markdown fences and no commentary.';
async function generate(kind){
  S.busy = true; S.err = ''; render();
  try {
    if (kind === 'flash') {
      const have = S.flash.map(c => c.q).slice(-80).join(' | ');
      const d = parseJSON(await call(`Create 12 new flashcards on this material. ${have ? 'Do not repeat these existing fronts: ' + have + '.' : ''} Cover different subtopics. ${JSONRULE} Shape: {"cards":[{"q":"front","a":"back","src":"source name"}]}`));
      S.flash.push(...(d.cards || []));
    } else if (kind === 'quiz') {
      const have = S.quiz.map(c => c.q).slice(-60).join(' | ');
      const d = parseJSON(await call(`Create 8 new multiple-choice questions with 4 options each. ${have ? 'Do not repeat: ' + have + '.' : ''} ${JSONRULE} Shape: {"questions":[{"q":"","options":["","","",""],"answer":0,"why":"explanation","src":"source name"}]}`));
      S.quiz.push(...(d.questions || []).map(q => ({ ...q, pick: null })));
    } else if (kind === 'slides') {
      const have = S.slides.map(c => c.title).join(' | ');
      const d = parseJSON(await call(`Create 8 new slides for a study presentation. ${have ? 'Continue after these existing slides: ' + have + '.' : 'Start with an overview slide.'} ${JSONRULE} Shape: {"slides":[{"title":"","bullets":["","",""],"notes":"speaker notes"}]}`));
      S.slides.push(...(d.slides || []));
    } else if (kind === 'expert') {
      const have = S.expert.map(c => c.problem).slice(-40).join(' | ');
      const d = parseJSON(await call(`Create 4 new expert-level worked problems with full step solutions. ${have ? 'Do not repeat: ' + have + '.' : ''} ${JSONRULE} Shape: {"problems":[{"problem":"","steps":["",""],"answer":"","pitfall":"","src":"source name"}]}`, { max: 4500 }));
      S.expert.push(...(d.problems || []));
    } else if (kind === 'guide') {
      const t = await call(`Write a thorough study guide in Markdown with objectives, core concepts, key terms, and summaries.`, { max: 4500 });
      S.guide = t;
    } else if (kind === 'spark') {
      const t = await call(`Write quick review notes in Markdown with key ideas and 5 quick takeaways.`, { max: 4500 });
      S.spark = t;
    }
    if (kind === 'slides' && S.slides.length > 8) S.idx = S.slides.length - 8;
  } catch (e) { S.err = e.message; }
  S.busy = false; render();
}
async function ask(){
  const q = $('#q').value.trim(); if (!q) return;
  S.busy = true; S.err = ''; S.chat.push({ role: 'user', text: q }); render();
  try {
    const hist = S.chat.slice(0, -1).map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', text: m.text }));
    const a = await call(q, { max: 3000, system: SYSTEM + ' Answer directly and clearly.', history: hist });
    S.chat.push({ role: 'ai', text: a });
  } catch (e) { S.err = e.message; S.chat.pop(); }
  S.busy = false; render();
}

/* ---------- rendering ---------- */
function md(t){
  const lines = esc(t).split('\n'); let out = '', inList = false;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  for (const l of lines) {
    const h = l.match(/^(#{1,3})\s+(.*)/), li = l.match(/^\s*[-*•]\s+(.*)/);
    if (li) { if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + inline(li[1]) + '</li>'; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    if (h) out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if (l.trim()) out += '<p>' + inline(l) + '</p>';
  }
  return out + (inList ? '</ul>' : '');
}
function render(){
  $('#tabs').innerHTML = TOOLS.map(([k, n]) => `<button role="tab" aria-selected="${S.tab === k}" data-k="${k}">${n}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.k; S.err = ''; render(); });
  const k = S.tab, p = $('#panel');
  const bar = (label, n) => `<div class="row" style="margin-bottom:16px"><button class="pri" id="gen" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Generating…' : n ? 'Generate More' : label}</button>${n ? `<span class="mut">${n} items created</span>` : ''}</div>${S.err ? `<p class="err" role="alert">${esc(S.err)}</p>` : ''}`;
  const src = x => x ? `<small>${esc(x)}</small>` : '';
  let h = '';
  if (k === 'flash') {
    h = bar('Create Flashcards', S.flash.length) + `<div class="grid">${S.flash.map((c, i) => `<div class="fc ${c.flip ? 'flip' : ''}" data-i="${i}" role="button" aria-label="Flashcard ${i + 1}, click to flip"><span>${esc(c.flip ? c.a : c.q)}</span>${src(c.flip ? c.src : 'Click to flip card')}</div>`).join('')}</div>`;
  } else if (k === 'quiz') {
    const done = S.quiz.filter(q => q.pick !== null), right = done.filter(q => q.pick === q.answer).length;
    h = bar('Create Practice Test', S.quiz.length) + (done.length ? `<p class="mut">Score: <b>${right}</b> / ${done.length} correct</p>` : '') +
      S.quiz.map((q, i) => `<div class="card"><div style="font-weight:700;margin-bottom:12px">${i + 1}. ${esc(q.q)}</div>${q.options.map((o, j) => `<button class="opt ${q.pick === null ? '' : j === q.answer ? 'right' : j === q.pick ? 'wrong' : ''}" data-i="${i}" data-j="${j}" ${q.pick !== null ? 'disabled' : ''}>${esc(o)}</button>`).join('')}${q.pick !== null ? `<p style="margin-top:12px"><b>Explanation:</b> ${esc(q.why)} ${src(q.src)}</p>` : ''}</div>`).join('');
  } else if (k === 'slides') {
    const s = S.slides[S.idx];
    h = bar('Create Slide Deck', S.slides.length) + (s ? `<div class="card slide"><h2>${esc(s.title)}</h2><ul>${(s.bullets || []).map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>
      <div class="row" style="justify-content:space-between"><button id="prev" ${S.idx === 0 ? 'disabled' : ''}>← Previous</button><span class="mut">Slide ${S.idx + 1} of ${S.slides.length}</span><button id="next" ${S.idx >= S.slides.length - 1 ? 'disabled' : ''}>Next →</button></div>
      <details style="margin-top:16px"><summary>Speaker Notes</summary><p>${esc(s.notes)}</p></details>` : '');
  } else if (k === 'expert') {
    h = bar('Generate Expert Solutions', S.expert.length) + S.expert.map((x, i) => `<details ${i === S.expert.length - 1 ? 'open' : ''}><summary>${esc(x.problem)}</summary><ol>${(x.steps || []).map(t => `<li>${esc(t)}</li>`).join('')}</ol><p style="margin-top:8px"><b>Answer:</b> ${esc(x.answer)}</p>${x.pitfall ? `<p><b>Common Pitfall:</b> ${esc(x.pitfall)}</p>` : ''}${src(x.src)}</details>`).join('');
  } else if (k === 'guide' || k === 'spark') {
    const t = S[k];
    h = bar(k === 'guide' ? 'Generate Study Guide' : 'Generate Quick Notes', t ? 1 : 0).replace('1 items created', 'Ready') + (t ? `<div class="card md">${md(t)}</div>` : '');
  } else {
    h = `<div class="card" style="min-height:200px;max-height:450px;overflow-y:auto">${S.chat.length ? S.chat.map(m => `<div class="msg ${m.role === 'user' ? 'u' : ''} ${m.role === 'ai' ? 'md' : ''}">${m.role === 'ai' ? md(m.text) : esc(m.text)}</div>`).join('') : '<p class="mut" style="text-align:center;margin:40px 0">Ask any question about your study materials or topic!</p>'}</div>${S.err ? `<p class="err" role="alert">${esc(S.err)}</p>` : ''}
      <div class="row" style="margin-top:10px"><input type="text" id="q" placeholder="Ask a follow-up question..." style="flex:1" aria-label="Your question"><button class="pri" id="send" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Thinking…' : 'Ask AI'}</button></div>`;
  }
  p.innerHTML = h;
  const g = $('#gen'); if (g) g.onclick = () => generate(k);
  p.querySelectorAll('.fc').forEach(b => b.onclick = () => { const c = S.flash[+b.dataset.i]; c.flip = !c.flip; render(); });
  p.querySelectorAll('.opt').forEach(b => b.onclick = () => { S.quiz[+b.dataset.i].pick = +b.dataset.j; render(); });
  const pv = $('#prev'), nx = $('#next');
  if (pv) pv.onclick = () => { S.idx--; render(); };
  if (nx) nx.onclick = () => { S.idx++; render(); };
  if ($('#send')) { $('#send').onclick = ask; $('#q').onkeydown = e => { if (e.key === 'Enter') ask(); }; }
}
document.addEventListener('keydown', e => {
  if (S.tab !== 'slides' || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight' && S.idx < S.slides.length - 1) { S.idx++; render(); }
  if (e.key === 'ArrowLeft' && S.idx > 0) { S.idx--; render(); }
});
render();
</script>
</body>
</html>
